<body>

<div class="app">

    <div
      id="toBox"
      class="hidden">

      <label>სად</label>

      <select id="to">

        <option value="">
          აირჩიე საწყობი
        </option>

        <option value="მთავარი საწყობი">
          მთავარი საწყობი
        </option>

        <option value="კასპი">
          კასპი
        </option>

        <option value="საწარმო">

        </option>

    <div

      ✅ ყველა პროდუქტის ერთიანად შესრულება

<script>

/* =====================================================
   შენი Apps Script Web App
   ===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbyRRp-5LGZQ9ogtUT6E_bSQLxDGYFkQHiIW0vy25A4mXxfiySSIy3uiCS6STORxNffS2Q/exec';


/* =====================================================
   STATE
   ===================================================== */

let scanner = null;

let scannerRunning = false;

let scannerLocked = false;
let manualScanTimer = null;
let manualScanCanvas = null;
let manualScanContext = null;

let currentProduct = null;

let cart = [];


/* =====================================================
   START
   ===================================================== */

async function startScanner() {

  if (scannerRunning) {
    return;
  }

  document.getElementById('scannerArea').classList.remove('hidden');
  document.getElementById('scanStatus').textContent = 'კამერის ჩართვა...';

  try {

    if (typeof Html5Qrcode === 'undefined') {
      throw new Error('QR ბიბლიოთეკა ვერ ჩაიტვირთა.');
    }

    if (scanner) {
      try { await scanner.stop(); } catch (e) {}
      try { scanner.clear(); } catch (e) {}
    }

    stopManualScanner();

    scanner = new Html5Qrcode('reader', { verbose: false });

    await scanner.start(
      {
        facingMode: { ideal: 'environment' }
      },
      {
        fps: 20,

        videoConstraints: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },

        qrbox: function(viewfinderWidth, viewfinderHeight) {
          const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
          const size = Math.floor(minEdge * 0.90);

          return {
            width: size,
            height: size
          };
        },

        aspectRatio: 1.7777778,
        disableFlip: false
      },

      function(decodedText) {
        handleScan(decodedText);
      },

      function() {}
    );

    scannerRunning = true;

    document.getElementById('scanStatus').textContent =
      'მოათავსე QR კამერაში. დამატებითი დაბალი ხარისხის სკანერიც მუშაობს...';

    startManualScanner();

  } catch (error) {

    scannerRunning = false;

    document.getElementById('scanStatus').textContent =
      'კამერა ვერ ჩაირთო. შეამოწმე კამერის უფლება.';

    console.error(error);
  }
}


/* =====================================================
   STOP
   ===================================================== */

async function stopScanner() {

  scannerRunning = false;
  scannerLocked = false;

  stopManualScanner();

  if (scanner) {
    try { await scanner.stop(); } catch (e) {}
    try { scanner.clear(); } catch (e) {}
  }

  scanner = null;
}



/* =====================================================
   EXTRA LOW-QUALITY QR DECODER
   ===================================================== */

function startManualScanner() {

  stopManualScanner();

  if (typeof jsQR === 'undefined') {
    console.warn('jsQR fallback ვერ ჩაიტვირთა.');
    return;
  }

  manualScanCanvas = document.createElement('canvas');

  manualScanContext = manualScanCanvas.getContext(
    '2d',
    { willReadFrequently: true }
  );

  manualScanTimer = setInterval(
    manualDecodeFrame,
    150
  );
}


function stopManualScanner() {

  if (manualScanTimer) {
    clearInterval(manualScanTimer);
  }

  manualScanTimer = null;
  manualScanCanvas = null;
  manualScanContext = null;
}


function manualDecodeFrame() {

  if (!scannerRunning || scannerLocked) {
    return;
  }

  const reader = document.getElementById('reader');

  if (!reader || !manualScanContext) {
    return;
  }

  const video = reader.querySelector('video');

  if (
    !video ||
    video.readyState < 2 ||
    !video.videoWidth ||
    !video.videoHeight
  ) {
    return;
  }

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  const maxSize = 1600;
  const scale = Math.min(
    1,
    maxSize / Math.max(vw, vh)
  );

  const w = Math.max(640, Math.floor(vw * scale));
  const h = Math.max(480, Math.floor(vh * scale));

  manualScanCanvas.width = w;
  manualScanCanvas.height = h;

  const ctx = manualScanContext;

  // 1) ორიგინალი კადრი
  ctx.filter = 'none';
  ctx.drawImage(video, 0, 0, w, h);

  let image = ctx.getImageData(0, 0, w, h);

  let result = jsQR(
    image.data,
    image.width,
    image.height,
    { inversionAttempts: 'attemptBoth' }
  );

  if (result && result.data) {
    handleScan(result.data);
    return;
  }

  // 2) გაძლიერებული კონტრასტი
  enhanceCanvasForQr(image, false);

  result = jsQR(
    image.data,
    image.width,
    image.height,
    { inversionAttempts: 'attemptBoth' }
  );

  if (result && result.data) {
    handleScan(result.data);
    return;
  }

  // 3) მკაცრი შავ-თეთრი threshold
  enhanceCanvasForQr(image, true);

  result = jsQR(
    image.data,
    image.width,
    image.height,
    { inversionAttempts: 'attemptBoth' }
  );

  if (result && result.data) {
    handleScan(result.data);
  }
}


function enhanceCanvasForQr(image, hardThreshold) {

  const data = image.data;

  for (let i = 0; i < data.length; i += 4) {

    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    let gray =
      (0.299 * r) +
      (0.587 * g) +
      (0.114 * b);

    gray =
      ((gray - 128) * 1.65) +
      128;

    gray = Math.max(
      0,
      Math.min(255, gray)
    );

    if (hardThreshold) {
      gray = gray < 150 ? 0 : 255;
    }

    data[i] = gray;
    data[i + 1] = gray;
    data[i + 2] = gray;
  }
}


/* =====================================================
   QR RECEIVED
   ===================================================== */

async function handleScan(
  decodedText
) {

  if (!scannerRunning) {
    return;
  }

  if (scannerLocked) {
    return;
  }

  scannerLocked = true;


  await stopScanner();


  document
    .getElementById('scanStatus')
    .textContent =
    'QR მიღებულია. პროდუქტის მოძებნა...';


  const code =
    extractCode(
      decodedText
    );


  if (!code) {

    scannerLocked = false;

    showResult(
      'QR კოდი ვერ წავიკითხე.',
      false
    );

    return;

  }


  getProduct(
    code
  );

}


/* =====================================================
   QR CODE CLEANING
   ===================================================== */

function extractCode(
  value
) {

  let code =
    String(
      value || ''
    ).trim();


  if (!code) {
    return '';
  }


  /*
    თუ QR-ში სრული URL არის,
    ?code=XXXX-დან კოდს იღებს.
  */

  try {

    const url =
      new URL(code);


    const urlCode =
      url.searchParams.get(
        'code'
      );


    if (urlCode) {

      return String(
        urlCode
      ).trim();

    }

  } catch (e) {}


  return code;

}


/* =====================================================
   GET PRODUCT
   ===================================================== */

function getProduct(
  code
) {

  callApi(
    'product',
    {
      productCode: code
    },

    function(result) {

      if (
        !result ||
        !result.success
      ) {

        showResult(
          result &&
          result.message
            ? result.message
            : 'პროდუქტი ვერ მოიძებნა.',
          false
        );

        scannerLocked = false;

        return;

      }


      currentProduct =
        result;


      document
        .getElementById(
          'productName'
        )
        .textContent =
        result.name || '';


      document
        .getElementById(
          'productCode'
        )
        .textContent =
        'QR: ' +
        result.code;


      document
        .getElementById(
          'productStock'
        )
        .textContent =
        'მთავარი: ' +
        number(result.mainStock) +
        ' | კასპი: ' +
        number(result.kaspiStock) +
        ' | საწარმო: ' +
        number(result.productionStock);


      document
        .getElementById(
          'quantity'
        )
        .value =
        '1';


      document
        .getElementById(
          'productBox'
        )
        .classList.remove(
          'hidden'
        );


      scannerLocked = false;

    }
  );

}


/* =====================================================
   ADD TO CART
   ===================================================== */

function addToCart() {

  if (!currentProduct) {

    showResult(
      'ჯერ პროდუქტი დაასკანერე.',
      false
    );

    return;

  }


  const quantity =
    Number(
      document
        .getElementById(
          'quantity'
        )
        .value
    );


  if (
    !quantity ||
    quantity <= 0
  ) {

    showResult(
      'რაოდენობა უნდა იყოს 0-ზე მეტი.',
      false
    );

    return;

  }


  const existing =
    cart.find(
      item =>
        item.productCode ===
        currentProduct.code
    );


  if (existing) {

    existing.quantity =
      Number(
        existing.quantity
      ) +
      quantity;

  } else {

    cart.push({

      productCode:
        currentProduct.code,

      productName:
        currentProduct.name,

      unit:
        currentProduct.unit,

      quantity:
        quantity

    });

  }


  saveCart();

  renderCart();


  currentProduct = null;


  document
    .getElementById(
      'productBox'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'scanStatus'
    )
    .textContent =
    'შემდეგი QR-ისთვის მზადაა.';


  /*
    ავტომატურად შემდეგი სკანირება
  */

  setTimeout(
    function() {

      startScanner();

    },
    250
  );

}


/* =====================================================
   NEXT QR
   ===================================================== */

function scanNext() {

  currentProduct = null;

  document
    .getElementById(
      'productBox'
    )
    .classList.add(
      'hidden'
    );

  startScanner();

}


/* =====================================================
   CART
   ===================================================== */

function renderCart() {

  const box =
    document.getElementById(
      'cart'
    );


  const empty =
    document.getElementById(
      'emptyCart'
    );


  document
    .getElementById(
      'cartCount'
    )
    .textContent =
    cart.length;


  box.innerHTML =
    '';


  if (!cart.length) {

    empty.classList.remove(
      'hidden'
    );

    return;

  }


  empty.classList.add(
    'hidden'
  );


  cart.forEach(
    function(item, index) {

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'cart-item';


      div.innerHTML =

        '<div class="cart-name">' +
        escapeHtml(
          item.productName
        ) +
        '</div>' +

        '<div class="cart-line">' +
        '<span>QR</span>' +
        '<b>' +
        escapeHtml(
          item.productCode
        ) +
        '</b>' +
        '</div>' +

        '<div class="cart-line">' +
        '<span>რაოდენობა</span>' +
        '<b>' +
        item.quantity +
        ' ' +
        escapeHtml(
          item.unit || ''
        ) +
        '</b>' +
        '</div>' +

        '<button ' +
        'class="red" ' +
        'onclick="removeCartItem(' +
        index +
        ')">' +
        '🗑 წაშლა' +
        '</button>';


      box.appendChild(
        div
      );

    }
  );

}


/* =====================================================
   REMOVE
   ===================================================== */

function removeCartItem(
  index
) {

  cart.splice(
    index,
    1
  );

  saveCart();

  renderCart();

}


/* =====================================================
   ACTION UI
   ===================================================== */

function actionChanged() {

  const action =
    document
      .getElementById(
        'action'
      )
      .value;


  document
    .getElementById(
      'fromBox'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'toBox'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'orderBox'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'clientBox'
    )
    .classList.add(
      'hidden'
    );


  if (
    action === 'გატანა'
  ) {

    document
      .getElementById(
        'fromBox'
      )
      .classList.remove(
        'hidden'
      );

    document
      .getElementById(
        'orderBox'
      )
      .classList.remove(
        'hidden'
      );

    document
      .getElementById(
        'clientBox'
      )
      .classList.remove(
        'hidden'
      );

  }


  if (
    action ===
    'მონტაჟზე გატანა'
  ) {

    document
      .getElementById(
        'fromBox'
      )
      .classList.remove(
        'hidden'
      );

  }


  if (
    action === 'გადატანა'
  ) {

    document
      .getElementById(
        'fromBox'
      )
      .classList.remove(
        'hidden'
      );

    document
      .getElementById(
        'toBox'
      )
      .classList.remove(
        'hidden'
      );

  }


  if (
    action === 'მიღება'
  ) {

    document
      .getElementById(
        'toBox'
      )
      .classList.remove(
        'hidden'
      );

  }

}


/* =====================================================
   EXECUTE CART
   ===================================================== */

function executeCart() {

  if (!cart.length) {

    showResult(
      'კალათა ცარიელია.',
      false
    );

    return;

  }


  const action =
    document
      .getElementById(
        'action'
      )
      .value;


  const from =
    document
      .getElementById(
        'from'
      )
      .value;


  const to =
    document
      .getElementById(
        'to'
      )
      .value;


  const orderNumber =
    document
      .getElementById(
        'orderNumber'
      )
      .value
      .trim();


  const clientName =
    document
      .getElementById(
        'clientName'
      )
      .value
      .trim();


  const employeeName =
    document
      .getElementById(
        'employeeName'
      )
      .value
      .trim();


  const note =
    document
      .getElementById(
        'note'
      )
      .value
      .trim();


  if (!action) {

    showResult(
      'აირჩიე მოქმედება.',
      false
    );

    return;

  }


  if (
    action === 'გატანა' ||
    action ===
    'მონტაჟზე გატანა'
  ) {

    if (!from) {

      showResult(
        'აირჩიე საიდან.',
        false
      );

      return;

    }

  }


  if (
    action === 'გადატანა'
  ) {

    if (!from || !to) {

      showResult(
        'აირჩიე საიდან და სად.',
        false
      );

      return;

    }


    if (from === to) {

      showResult(
        'საწყობი ერთნაირი ვერ იქნება.',
        false
      );

      return;

    }

  }


  if (
    action === 'მიღება'
  ) {

    if (!to) {

      showResult(
        'აირჩიე მიღების საწყობი.',
        false
      );

      return;

    }

  }


  if (
    action === 'გატანა' &&
    !orderNumber
  ) {

    showResult(
      'გატანისთვის მიუთითე შეკვეთის №.',
      false
    );

    return;

  }


  const button =
    document
      .getElementById(
        'executeButton'
      );


  button.classList.add(
    'loading'
  );


  button.textContent =
    '⏳ მუშავდება...';


  const data = {

    type:
      action,

    from:
      from,

    to:
      to,

    orderNumber:
      orderNumber,

    clientName:
      clientName,

    employeeName:
      employeeName,

    note:
      note,

    items:
      cart.map(
        function(item) {

          return {

            productCode:
              item.productCode,

            quantity:
              Number(
                item.quantity
              )

          };

        }
      )

  };


  callApi(

    'cart',

    {
      data:
        JSON.stringify(
          data
        )
    },

    function(result) {

      button.classList.remove(
        'loading'
      );

      button.textContent =
        '✅ ყველა პროდუქტის ერთიანად შესრულება';


      if (
        !result ||
        !result.success
      ) {

        showResult(
          result &&
          result.message
            ? result.message
            : 'ოპერაცია ვერ შესრულდა.',
          false
        );

        return;

      }


      cart = [];

      saveCart();

      renderCart();


      showResult(
        result.message ||
        'ოპერაცია წარმატებით შესრულდა.',
        true
      );

    }

  );

}


/* =====================================================
   API CALL
   ===================================================== */

function callApi(
  api,
  params,
  callback
) {

  /*
    Google Apps Script ContentService-ს სჭირდება JSONP,
    რადგან GitHub Pages და Apps Script სხვადასხვა origin-ზეა.

    Callback-ის სახელს განზრახ ვიყენებთ მხოლოდ ასოებისა და
    ციფრებისგან, რათა Apps Script-ის callback sanitizer-ს
    პრობლემა არ ჰქონდეს.
  */

  const callbackName =
    'pgCallback' +
    Date.now() +
    Math.floor(
      Math.random() * 1000000
    );


  const query = [];


  query.push(
    'api=' +
    encodeURIComponent(
      api
    )
  );


  query.push(
    'callback=' +
    encodeURIComponent(
      callbackName
    )
  );


  Object.keys(
    params || {}
  ).forEach(
    function(key) {

      query.push(

        encodeURIComponent(
          key
        ) +

        '=' +

        encodeURIComponent(
          params[key]
        )

      );

    }
  );


  const script =
    document.createElement(
      'script'
    );

  script.type =
    'text/javascript';

  script.async = true;


  let finished = false;


  function finish(result) {

    if (finished) {
      return;
    }

    finished = true;


    try {

      callback(
        result
      );

    } finally {

      try {
        delete window[
          callbackName
        ];
      } catch (e) {}

      if (script.parentNode) {
        script.parentNode.removeChild(
          script
        );
      }

    }

  }


  window[callbackName] =
    function(result) {

      finish(
        result
      );

    };


  script.onerror =
    function() {

      finish({

        success: false,

        message:
          'Apps Script API-სთან კავშირი ვერ მოხერხდა. გადაამოწმე Web App Deployment.'

      });

    };


  script.src =
    API_URL +
    '?' +
    query.join(
      '&'
    );


  /*
    Head-ში ვამატებთ, როგორც ნამდვილ JSONP
    script request-ს.
  */

  document
    .head
    .appendChild(
      script
    );


  /*
    20 წამიანი timeout.
  */

  setTimeout(
    function() {

      if (finished) {
        return;
      }

      finish({

        success: false,

        message:
          'სერვერის პასუხის მოლოდინის დრო ამოიწურა.'

      });

    },
    20000
  );

}


/* =====================================================
   LOCAL STORAGE
   ===================================================== */

function saveCart() {

  try {

    localStorage.setItem(
      'PLASTIC_GEORGIA_SCANNER_CART',
      JSON.stringify(
        cart
      )
    );

  } catch(e) {}

}


function loadCart() {

  try {

    const saved =
      localStorage.getItem(
        'PLASTIC_GEORGIA_SCANNER_CART'
      );


    if (saved) {

      cart =
        JSON.parse(
          saved
        ) || [];

    }

  } catch(e) {

    cart = [];

  }


  renderCart();

}


/* =====================================================
   HELPERS
   ===================================================== */

function number(
  value
) {

  const n =
    Number(
      value
    );


  return Number.isFinite(n)
    ? n
    : 0;

}


function escapeHtml(
  value
) {

  return String(
    value == null
      ? ''
      : value
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


function showResult(
  message,
  success
) {

  const box =
    document.getElementById(
      'result'
    );


  box.className =
    'result ' +
    (
      success
        ? 'success'
        : 'error'
    );


  box.textContent =
    message;

}


/* =====================================================
   INIT
   ===================================================== */

loadCart();

</script>
