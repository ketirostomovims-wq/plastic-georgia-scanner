    }

    .loading {

    }
  </style>

<body>

<div class="app">

        </option>

        </option>

<script>

/* =====================================================
   შენი Apps Script Web App
   ===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbyRRp-5LGZQ9ogtUT6E_bSQLxDGYFkQHiIW0vy25A4mXxfiySSIy3uiCS6STORxNffS2Q/exec';


/* =====================================================
   STATE
   ===================================================== */

let scanner = null;
let scannerStream = null;
let scannerRunning = false;
let scannerLocked = false;
let scannerFrameTimer = null;
let scannerCanvas = null;
let scannerContext = null;
let currentProduct = null;

let cart = [];


/* =====================================================
   START
   ===================================================== */

async function startScanner() {

  if (scannerRunning) {
    return;
  }

  document
    .getElementById('scannerArea')
    .classList.remove('hidden');

  document
    .getElementById('scanStatus')
    .textContent =
    'კამერის ჩართვა...';

  try {

    stopScanner();

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error('კამერა ამ ბრაუზერში მიუწვდომელია.');
    }

    const video =
      document.getElementById('cameraVideo');

    // მაქსიმალურად მაღალი რეალური კამერის რეჟიმი.
    scannerStream =
      await navigator.mediaDevices.getUserMedia({

        audio: false,

        video: {
          facingMode: {
            ideal: 'environment'
          },

          width: {
            ideal: 1920,
            min: 1280
          },

          height: {
            ideal: 1080,
            min: 720
          },

          frameRate: {
            ideal: 30,
            min: 15
          }
        }

      });

    video.srcObject = scannerStream;

    await video.play();

    scannerRunning = true;
    scannerLocked = false;

    scannerCanvas =
      document.createElement('canvas');

    scannerContext =
      scannerCanvas.getContext(
        '2d',
        {
          willReadFrequently: true
        }
      );

    // autofocus / zoom / exposure-ის მაქსიმალურად კარგი რეჟიმი
    await enableBestCameraSettings();

    // autofocus-ის ხელახლა მოთხოვნა რამდენიმე ეტაპად,
    // რადგან ზოგიერთ Android/iPhone ბრაუზერს კამერის ჩართვის
    // პირველივე წამზე focus constraint არ მიაქვს.
    await forceContinuousFocus();

    document
      .getElementById('scanStatus')
      .textContent =
      'მიმართე QR-ს კამერაზე — ავტოფოკუსი ავტომატურად ჩაირთვება...';

    startFrameScanning();

  } catch (error) {

    scannerRunning = false;

    document
      .getElementById('scanStatus')
      .textContent =
      'კამერა ვერ ჩაირთო. შეამოწმე კამერის უფლება.';

    console.error(error);

  }
}


async function enableBestCameraSettings() {

  if (!scannerStream) {
    return;
  }

  const track =
    scannerStream.getVideoTracks()[0];

  if (!track) {
    return;
  }

  try {

    const capabilities =
      track.getCapabilities();

    const advanced = {};

    // Continuous autofocus.
    if (
      capabilities.focusMode &&
      Array.isArray(capabilities.focusMode)
    ) {

      if (
        capabilities.focusMode.includes(
          'continuous'
        )
      ) {

        advanced.focusMode =
          'continuous';

      } else if (
        capabilities.focusMode.includes(
          'auto'
        )
      ) {

        advanced.focusMode =
          'auto';
      }
    }

    // Continuous exposure / white balance, თუ მხარდაჭერილია.
    if (
      capabilities.exposureMode &&
      Array.isArray(capabilities.exposureMode) &&
      capabilities.exposureMode.includes(
        'continuous'
      )
    ) {

      advanced.exposureMode =
        'continuous';
    }

    if (
      capabilities.whiteBalanceMode &&
      Array.isArray(capabilities.whiteBalanceMode) &&
      capabilities.whiteBalanceMode.includes(
        'continuous'
      )
    ) {

      advanced.whiteBalanceMode =
        'continuous';
    }

    // ზომიერი zoom — QR უფრო დიდი ხდება,
    // მაგრამ ძალიან ახლოს არ მიაქვს.
    if (
      capabilities.zoom &&
      typeof capabilities.zoom.max === 'number'
    ) {

      const minZoom =
        typeof capabilities.zoom.min === 'number'
          ? capabilities.zoom.min
          : 1;

      const maxZoom =
        capabilities.zoom.max;

      const targetZoom =
        Math.min(
          maxZoom,
          Math.max(
            minZoom,
            Math.min(
              2.0,
              maxZoom
            )
          )
        );

      advanced.zoom =
        targetZoom;
    }

    if (
      Object.keys(advanced).length
    ) {

      try {

        await track.applyConstraints({
          advanced: [
            advanced
          ]
        });

      } catch (e) {

        console.warn(
          'advanced camera constraints ვერ დაყენდა:',
          e
        );

        // fallback — პირდაპირ ძირითადი constraints
        try {

          await track.applyConstraints(
            advanced
          );

        } catch (e2) {

          console.warn(
            'camera constraints fallback-იც ვერ დაყენდა:',
            e2
          );
        }
      }
    }

  } catch (e) {

    console.warn(
      'კამერის capabilities ვერ წავიკითხე:',
      e
    );
  }
}


async function forceContinuousFocus() {

  if (!scannerStream) {
    return;
  }

  const track =
    scannerStream.getVideoTracks()[0];

  if (!track) {
    return;
  }

  try {

    const capabilities =
      track.getCapabilities();

    if (
      capabilities.focusMode &&
      Array.isArray(
        capabilities.focusMode
      )
    ) {

      if (
        capabilities.focusMode.includes(
          'continuous'
        )
      ) {

        await track.applyConstraints({
          advanced: [
            {
              focusMode:
                'continuous'
            }
          ]
        });

        return;
      }

      if (
        capabilities.focusMode.includes(
          'auto'
        )
      ) {

        await track.applyConstraints({
          advanced: [
            {
              focusMode:
                'auto'
            }
          ]
        });
      }
    }

  } catch (e) {

    console.warn(
      'autofocus ვერ ჩაირთო:',
      e
    );
  }

  /*
   * ზოგიერთ ტელეფონზე autofocus მხოლოდ
   * კამერის ხელახლა მოთხოვნისას აქტიურდება.
   * ამიტომ პატარა delay-ის შემდეგ კიდევ ერთხელ
   * ვთხოვთ continuous focus-ს.
   */
  setTimeout(
    async function() {

      if (
        !scannerRunning ||
        !scannerStream
      ) {
        return;
      }

      try {

        const currentTrack =
          scannerStream.getVideoTracks()[0];

        if (!currentTrack) {
          return;
        }

        const caps =
          currentTrack.getCapabilities();

        if (
          caps.focusMode &&
          Array.isArray(
            caps.focusMode
          ) &&
          caps.focusMode.includes(
            'continuous'
          )
        ) {

          await currentTrack.applyConstraints({
            advanced: [
              {
                focusMode:
                  'continuous'
              }
            ]
          });
        }

      } catch (e) {}

    },
    1200
  );
}


function startFrameScanning() {

  stopFrameScanning();

  scannerFrameTimer =
    setInterval(
      scanCameraFrame,
      100
    );
}


function stopFrameScanning() {

  if (scannerFrameTimer) {
    clearInterval(
      scannerFrameTimer
    );
  }

  scannerFrameTimer = null;
}


function scanCameraFrame() {

  if (
    !scannerRunning ||
    scannerLocked ||
    !scannerContext ||
    !scannerCanvas
  ) {
    return;
  }

  const video =
    document.getElementById(
      'cameraVideo'
    );

  if (
    !video ||
    video.readyState < 2 ||
    !video.videoWidth ||
    !video.videoHeight
  ) {
    return;
  }

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  /*
   * 4 სხვადასხვა crop:
   * 1. სრული კადრი
   * 2. ცენტრალური 90%
   * 3. ცენტრალური 70%
   * 4. ცენტრალური 55%
   *
   * ეს ზრდის შანსს, რომ დაბეჭდილი QR
   * საკმარისი პიქსელებით მოხვდეს decoder-ში.
   */

  const regions = [
    {
      x: 0,
      y: 0,
      w: vw,
      h: vh
    },
    {
      x: vw * 0.05,
      y: vh * 0.05,
      w: vw * 0.90,
      h: vh * 0.90
    },
    {
      x: vw * 0.15,
      y: vh * 0.15,
      w: vw * 0.70,
      h: vh * 0.70
    },
    {
      x: vw * 0.225,
      y: vh * 0.225,
      w: vw * 0.55,
      h: vh * 0.55
    }
  ];

  for (
    let i = 0;
    i < regions.length;
    i++
  ) {

    if (
      !scannerRunning ||
      scannerLocked
    ) {
      return;
    }

    const r =
      regions[i];

    // decoder-ისთვის ვზრდით კადრს.
    const maxOutput = 1800;

    const scale =
      Math.min(
        1.5,
        maxOutput /
          Math.max(
            r.w,
            r.h
          )
      );

    const outW =
      Math.max(
        800,
        Math.floor(
          r.w * scale
        )
      );

    const outH =
      Math.max(
        600,
        Math.floor(
          r.h * scale
        )
      );

    scannerCanvas.width = outW;
    scannerCanvas.height = outH;

    scannerContext
      .drawImage(
        video,
        r.x,
        r.y,
        r.w,
        r.h,
        0,
        0,
        outW,
        outH
      );

    let image =
      scannerContext.getImageData(
        0,
        0,
        outW,
        outH
      );

    // Pass 1 — original
    let result =
      decodeJsQr(
        image
      );

    if (result) {
      handleScan(
        result
      );
      return;
    }

    // Pass 2 — contrast
    enhanceQrImage(
      image,
      1.8,
      false
    );

    result =
      decodeJsQr(
        image
      );

    if (result) {
      handleScan(
        result
      );
      return;
    }

    // Pass 3 — threshold
    enhanceQrImage(
      image,
      2.2,
      true
    );

    result =
      decodeJsQr(
        image
      );

    if (result) {
      handleScan(
        result
      );
      return;
    }
  }
}


function decodeJsQr(image) {

  if (
    typeof jsQR === 'undefined'
  ) {
    return null;
  }

  try {

    const result =
      jsQR(
        image.data,
        image.width,
        image.height,
        {
          inversionAttempts:
            'attemptBoth'
        }
      );

    return result &&
      result.data
      ? result.data
      : null;

  } catch (e) {

    return null;
  }
}


function enhanceQrImage(
  image,
  contrast,
  hardThreshold
) {

  const data =
    image.data;

  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    const r =
      data[i];

    const g =
      data[i + 1];

    const b =
      data[i + 2];

    let gray =
      (0.299 * r) +
      (0.587 * g) +
      (0.114 * b);

    gray =
      ((gray - 128) *
        contrast) +
      128;

    gray =
      Math.max(
        0,
        Math.min(
          255,
          gray
        )
      );

    if (hardThreshold) {

      gray =
        gray < 145
          ? 0
          : 255;
    }

    data[i] =
      gray;

    data[i + 1] =
      gray;

    data[i + 2] =
      gray;
  }
}


/* =====================================================
   STOP
   ===================================================== */

async function stopScanner() {

  scannerRunning = false;
  scannerLocked = false;

  stopFrameScanning();

  if (scannerStream) {

    scannerStream
      .getTracks()
      .forEach(
        function(track) {
          try {
            track.stop();
          } catch (e) {}
        }
      );
  }

  scannerStream = null;

  const video =
    document.getElementById(
      'cameraVideo'
    );

  if (video) {
    try {
      video.pause();
    } catch (e) {}

    video.srcObject = null;
  }

  scannerCanvas = null;
  scannerContext = null;
}


/* =====================================================
   QR RECEIVED
   ===================================================== */

async function handleScan(
  decodedText
) {

  if (!scannerRunning) {
    return;
  }

  if (scannerLocked) {
    return;
  }

  scannerLocked = true;


  await stopScanner();


  document
    .getElementById('scanStatus')
    .textContent =
    'QR მიღებულია. პროდუქტის მოძებნა...';


  const code =
    extractCode(
      decodedText
    );


  if (!code) {

    scannerLocked = false;

    showResult(
      'QR კოდი ვერ წავიკითხე.',
      false
    );

    return;

  }


  getProduct(
    code
  );

}


/* =====================================================
   QR CODE CLEANING
   ===================================================== */

function extractCode(
  value
) {

  let code =
    String(
      value || ''
    ).trim();


  if (!code) {
    return '';
  }


  /*
    თუ QR-ში სრული URL არის,
    ?code=XXXX-დან კოდს იღებს.
  */

  try {

    const url =
      new URL(code);


    const urlCode =
      url.searchParams.get(
        'code'
      );


    if (urlCode) {

      return String(
        urlCode
      ).trim();

    }

  } catch (e) {}


  return code;

}


/* =====================================================
   GET PRODUCT
   ===================================================== */

function getProduct(
  code
) {

  callApi(
    'product',
    {
      productCode: code
    },

    function(result) {

      if (
        !result ||
        !result.success
      ) {

        showResult(
          result &&
          result.message
            ? result.message
            : 'პროდუქტი ვერ მოიძებნა.',
          false
        );

        scannerLocked = false;

        return;

      }


      currentProduct =
        result;


      document
        .getElementById(
          'productName'
        )
        .textContent =
        result.name || '';


      document
        .getElementById(
          'productCode'
        )
        .textContent =
        'QR: ' +
        result.code;


      document
        .getElementById(
          'productStock'
        )
        .textContent =
        'მთავარი: ' +
        number(result.mainStock) +
        ' | კასპი: ' +
        number(result.kaspiStock) +
        ' | საწარმო: ' +
        number(result.productionStock);


      document
        .getElementById(
          'quantity'
        )
        .value =
        '1';


      document
        .getElementById(
          'productBox'
        )
        .classList.remove(
          'hidden'
        );


      scannerLocked = false;

    }
  );

}


/* =====================================================
   ADD TO CART
   ===================================================== */

function addToCart() {

  if (!currentProduct) {

    showResult(
      'ჯერ პროდუქტი დაასკანერე.',
      false
    );

    return;

  }


  const quantity =
    Number(
      document
        .getElementById(
          'quantity'
        )
        .value
    );


  if (
    !quantity ||
    quantity <= 0
  ) {

    showResult(
      'რაოდენობა უნდა იყოს 0-ზე მეტი.',
      false
    );

    return;

  }


  const existing =
    cart.find(
      item =>
        item.productCode ===
        currentProduct.code
    );


  if (existing) {

    existing.quantity =
      Number(
        existing.quantity
      ) +
      quantity;

  } else {

    cart.push({

      productCode:
        currentProduct.code,

      productName:
        currentProduct.name,

      unit:
        currentProduct.unit,

      quantity:
        quantity

    });

  }


  saveCart();

  renderCart();


  currentProduct = null;


  document
    .getElementById(
      'productBox'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'scanStatus'
    )
    .textContent =
    'შემდეგი QR-ისთვის მზადაა.';


  /*
    ავტომატურად შემდეგი სკანირება
  */

  setTimeout(
    function() {

      startScanner();

    },
    250
  );

}


/* =====================================================
   NEXT QR
   ===================================================== */

function scanNext() {

  currentProduct = null;

  document
    .getElementById(
      'productBox'
    )
    .classList.add(
      'hidden'
    );

  startScanner();

}


/* =====================================================
   CART
   ===================================================== */

function renderCart() {

  const box =
    document.getElementById(
      'cart'
    );


  const empty =
    document.getElementById(
      'emptyCart'
    );


  document
    .getElementById(
      'cartCount'
    )
    .textContent =
    cart.length;


  box.innerHTML =
    '';


  if (!cart.length) {

    empty.classList.remove(
      'hidden'
    );

    return;

  }


  empty.classList.add(
    'hidden'
  );


  cart.forEach(
    function(item, index) {

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'cart-item';


      div.innerHTML =

        '<div class="cart-name">' +
        escapeHtml(
          item.productName
        ) +
        '</div>' +

        '<div class="cart-line">' +
        '<span>QR</span>' +
        '<b>' +
        escapeHtml(
          item.productCode
        ) +
        '</b>' +
        '</div>' +

        '<div class="cart-line">' +
        '<span>რაოდენობა</span>' +
        '<b>' +
        item.quantity +
        ' ' +
        escapeHtml(
          item.unit || ''
        ) +
        '</b>' +
        '</div>' +

        '<button ' +
        'class="red" ' +
        'onclick="removeCartItem(' +
        index +
        ')">' +
        '🗑 წაშლა' +
        '</button>';


      box.appendChild(
        div
      );

    }
  );

}


/* =====================================================
   REMOVE
   ===================================================== */

function removeCartItem(
  index
) {

  cart.splice(
    index,
    1
  );

  saveCart();

  renderCart();

}


/* =====================================================
   ACTION UI
   ===================================================== */

function actionChanged() {

  const action =
    document
      .getElementById(
        'action'
      )
      .value;


  document
    .getElementById(
      'fromBox'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'toBox'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'orderBox'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'clientBox'
    )
    .classList.add(
      'hidden'
    );


  if (
    action === 'გატანა'
  ) {

    document
      .getElementById(
        'fromBox'
      )
      .classList.remove(
        'hidden'
      );

    document
      .getElementById(
        'orderBox'
      )
      .classList.remove(
        'hidden'
      );

    document
      .getElementById(
        'clientBox'
      )
      .classList.remove(
        'hidden'
      );

  }


  if (
    action ===
    'მონტაჟზე გატანა'
  ) {

    document
      .getElementById(
        'fromBox'
      )
      .classList.remove(
        'hidden'
      );

  }


  if (
    action === 'გადატანა'
  ) {

    document
      .getElementById(
        'fromBox'
      )
      .classList.remove(
        'hidden'
      );

    document
      .getElementById(
        'toBox'
      )
      .classList.remove(
        'hidden'
      );

  }


  if (
    action === 'მიღება'
  ) {

    document
      .getElementById(
        'toBox'
      )
      .classList.remove(
        'hidden'
      );

  }

}


/* =====================================================
   EXECUTE CART
   ===================================================== */

function executeCart() {

  if (!cart.length) {

    showResult(
      'კალათა ცარიელია.',
      false
    );

    return;

  }


  const action =
    document
      .getElementById(
        'action'
      )
      .value;


  const from =
    document
      .getElementById(
        'from'
      )
      .value;


  const to =
    document
      .getElementById(
        'to'
      )
      .value;


  const orderNumber =
    document
      .getElementById(
        'orderNumber'
      )
      .value
      .trim();


  const clientName =
    document
      .getElementById(
        'clientName'
      )
      .value
      .trim();


  const employeeName =
    document
      .getElementById(
        'employeeName'
      )
      .value
      .trim();


  const note =
    document
      .getElementById(
        'note'
      )
      .value
      .trim();


  if (!action) {

    showResult(
      'აირჩიე მოქმედება.',
      false
    );

    return;

  }


  if (
    action === 'გატანა' ||
    action ===
    'მონტაჟზე გატანა'
  ) {

    if (!from) {

      showResult(
        'აირჩიე საიდან.',
        false
      );

      return;

    }

  }


  if (
    action === 'გადატანა'
  ) {

    if (!from || !to) {

      showResult(
        'აირჩიე საიდან და სად.',
        false
      );

      return;

    }


    if (from === to) {

      showResult(
        'საწყობი ერთნაირი ვერ იქნება.',
        false
      );

      return;

    }

  }


  if (
    action === 'მიღება'
  ) {

    if (!to) {

      showResult(
        'აირჩიე მიღების საწყობი.',
        false
      );

      return;

    }

  }


  if (
    action === 'გატანა' &&
    !orderNumber
  ) {

    showResult(
      'გატანისთვის მიუთითე შეკვეთის №.',
      false
    );

    return;

  }


  const button =
    document
      .getElementById(
        'executeButton'
      );


  button.classList.add(
    'loading'
  );


  button.textContent =
    '⏳ მუშავდება...';


  const data = {

    type:
      action,

    from:
      from,

    to:
      to,

    orderNumber:
      orderNumber,

    clientName:
      clientName,

    employeeName:
      employeeName,

    note:
      note,

    items:
      cart.map(
        function(item) {

          return {

            productCode:
              item.productCode,

            quantity:
              Number(
                item.quantity
              )

          };

        }
      )

  };


  callApi(

    'cart',

    {
      data:
        JSON.stringify(
          data
        )
    },

    function(result) {

      button.classList.remove(
        'loading'
      );

      button.textContent =
        '✅ ყველა პროდუქტის ერთიანად შესრულება';


      if (
        !result ||
        !result.success
      ) {

        showResult(
          result &&
          result.message
            ? result.message
            : 'ოპერაცია ვერ შესრულდა.',
          false
        );

        return;

      }


      cart = [];

      saveCart();

      renderCart();


      showResult(
        result.message ||
        'ოპერაცია წარმატებით შესრულდა.',
        true
      );

    }

  );

}


/* =====================================================
   API CALL
   ===================================================== */

function callApi(
  api,
  params,
  callback
) {

  /*
    Google Apps Script ContentService-ს სჭირდება JSONP,
    რადგან GitHub Pages და Apps Script სხვადასხვა origin-ზეა.

    Callback-ის სახელს განზრახ ვიყენებთ მხოლოდ ასოებისა და
    ციფრებისგან, რათა Apps Script-ის callback sanitizer-ს
    პრობლემა არ ჰქონდეს.
  */

  const callbackName =
    'pgCallback' +
    Date.now() +
    Math.floor(
      Math.random() * 1000000
    );


  const query = [];


  query.push(
    'api=' +
    encodeURIComponent(
      api
    )
  );


  query.push(
    'callback=' +
    encodeURIComponent(
      callbackName
    )
  );


  Object.keys(
    params || {}
  ).forEach(
    function(key) {

      query.push(

        encodeURIComponent(
          key
        ) +

        '=' +

        encodeURIComponent(
          params[key]
        )

      );

    }
  );


  const script =
    document.createElement(
      'script'
    );

  script.type =
    'text/javascript';

  script.async = true;


  let finished = false;


  function finish(result) {

    if (finished) {
      return;
    }

    finished = true;


    try {

      callback(
        result
      );

    } finally {

      try {
        delete window[
          callbackName
        ];
      } catch (e) {}

      if (script.parentNode) {
        script.parentNode.removeChild(
          script
        );
      }

    }

  }


  window[callbackName] =
    function(result) {

      finish(
        result
      );

    };


  script.onerror =
    function() {

      finish({

        success: false,

        message:
          'Apps Script API-სთან კავშირი ვერ მოხერხდა. გადაამოწმე Web App Deployment.'

      });

    };


  script.src =
    API_URL +
    '?' +
    query.join(
      '&'
    );


  /*
    Head-ში ვამატებთ, როგორც ნამდვილ JSONP
    script request-ს.
  */

  document
    .head
    .appendChild(
      script
    );


  /*
    20 წამიანი timeout.
  */

  setTimeout(
    function() {

      if (finished) {
        return;
      }

      finish({

        success: false,

        message:
          'სერვერის პასუხის მოლოდინის დრო ამოიწურა.'

      });

    },
    20000
  );

}


/* =====================================================
   LOCAL STORAGE
   ===================================================== */

function saveCart() {

  try {

    localStorage.setItem(
      'PLASTIC_GEORGIA_SCANNER_CART',
      JSON.stringify(
        cart
      )
    );

  } catch(e) {}

}


function loadCart() {

  try {

    const saved =
      localStorage.getItem(
        'PLASTIC_GEORGIA_SCANNER_CART'
      );


    if (saved) {

      cart =
        JSON.parse(
          saved
        ) || [];

    }

  } catch(e) {

    cart = [];

  }


  renderCart();

}


/* =====================================================
   HELPERS
   ===================================================== */

function number(
  value
) {

  const n =
    Number(
      value
    );


  return Number.isFinite(n)
    ? n
    : 0;

}


function escapeHtml(
  value
) {

  return String(
    value == null
      ? ''
      : value
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


function showResult(
  message,
  success
) {

  const box =
    document.getElementById(
      'result'
    );


  box.className =
    'result ' +
    (
      success
        ? 'success'
        : 'error'
    );


  box.textContent =
    message;

}


/* =====================================================
   INIT
   ===================================================== */

loadCart();

</script>
